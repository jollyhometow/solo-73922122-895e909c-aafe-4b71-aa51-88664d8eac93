worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Uploads can be as large as the API's MAX_UPLOAD_BYTES (default 200 MB).
    client_max_body_size 256m;
    sendfile on;

    upstream dicom_api {
        # Round-robin across the two independent API processes.
        server api1:8000;
        server api2:8000;
    }

    server {
        listen 8080;

        # Long-lived uploads / background processing: generous timeouts.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        location / {
            proxy_pass http://dicom_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Replica-Routed $upstream_addr;
        }

        # nginx-level health endpoint.
        location = /nginx-health {
            default_type text/plain;
            return 200 "nginx ok\n";
        }
    }
}
