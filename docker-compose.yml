services:
  api1:
    build: .
    image: dicom-deid:latest
    environment:
      REPLICA_ID: api1
      DICOM_DATA_DIR: /data
    volumes:
      - dicom-data:/data
    ports:
      - "8001:8000"
    restart: unless-stopped

  api2:
    image: dicom-deid:latest
    build: .
    depends_on:
      - api1
    environment:
      REPLICA_ID: api2
      DICOM_DATA_DIR: /data
    volumes:
      - dicom-data:/data
    ports:
      - "8002:8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api1
      - api2
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  # One-shot end-to-end demo: cross-package references + concurrent uploads.
  # Run with: docker compose run --rm demo
  demo:
    image: dicom-deid:latest
    depends_on:
      - nginx
    profiles: ["demo"]
    environment:
      DICOM_DATA_DIR: /data
    volumes:
      - dicom-data:/data
    entrypoint: ["python", "scripts/demo.py", "--base-url", "http://nginx:8080"]

volumes:
  dicom-data:
